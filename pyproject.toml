[project]
name = "video-game-power-profiler"
version = "0.0.0"
dependencies = [
    "pythonnet"
]
requires-python = ">= 3.14"
authors = [
    { name = "Julien Lukasewycz", email = "julien.lukasewycz@uni-due.de" }
]
maintainers = [
    { name = "Julien Lukasewycz", email = "julien.lukasewycz@uni-due.de" }
]
description = "A software measuring the power consumption of video games."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
keywords = [
    "environmental-sustainability",
    "green computing",
    "green-gaming",
    "power-consumption",
    "power-measurement",
    "power-model",
    "video-games"
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing"
]

[project.urls]
Repository = "https://github.com/Julien-Lukasewycz/Video-Game-Power-Profiler.git"
Issues = "https://github.com/Julien-Lukasewycz/Video-Game-Power-Profiler/issues"
Changelog = "https://github.com/Julien-Lukasewycz/Video-Game-Power-Profiler/blob/main/CHANGELOG.md"
